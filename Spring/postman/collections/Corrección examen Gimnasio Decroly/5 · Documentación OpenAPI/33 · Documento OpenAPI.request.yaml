$kind: http-request
url: "{{baseUrl}}/v3/api-docs"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const R = JSON.parse(pm.collectionVariables.get('resultados') || '{}');
      const t = (n, f) => { const id = n.slice(1, 4); let ok = true, msg = ''; try { f(); } catch (e) { ok = false; msg = e && e.message ? e.message : String(e); } pm.test(n, () => { if (!ok) throw new Error(msg); }); const e = R[id] || (R[id] = [0, 0, []]); if (ok) e[0]++; else { e[1]++; if (e[2].length < 6) e[2].push(n.slice(6) + (msg ? ' → ' + msg : '')); } };
      const cod = pm.response.code;
      let j = null; try { j = pm.response.json(); } catch (e) { j = null; }
      const exige = (c, m) => { if (!c) throw new Error(m); };
      const esperado = (...cs) => exige(cs.includes(cod), 'Recibido ' + cod + ', se esperaba ' + cs.join(' o '));
      const exito = () => exige(cod >= 200 && cod < 300, 'Recibido ' + cod + (cod === 404 ? ' (la ruta o la actividad no existe)' : ''));
      const error4xx = () => exige(cod >= 400 && cod < 500, 'Recibido ' + cod + ', se esperaba un error 4xx');
      const rechaza = () => exige(cod >= 400 && cod < 500 && cod !== 404 && cod !== 405, 'Recibido ' + cod + ': no se ha aplicado la regla');
      const no500 = () => exige(cod < 500, 'Recibido ' + cod + ': un error del cliente no puede acabar en 500');
      const problema = () => { const ct = String(pm.response.headers.get('Content-Type') || ''); exige(ct.includes('problem+json') || (j && typeof j === 'object' && !Array.isArray(j) && 'status' in j && ('title' in j || 'detail' in j)), 'La respuesta de error no es un ProblemDetail (Content-Type ' + (ct || 'vacío') + ')'); };
      const esJson = () => exige(String(pm.response.headers.get('Content-Type') || '').includes('json') && j !== null, 'La respuesta no es JSON');
      const lista = () => { exige(Array.isArray(j), 'La respuesta no es una lista JSON'); return j; };
      const v = (k) => pm.collectionVariables.get(k);
      const paths = (j && j.paths) || {};
      const rid = Object.keys(paths).find(p => /^\/api\/actividades\/\{[^}]+\}$/.test(p));
      const ops = [['GET', '/api/actividades'], ['POST', '/api/actividades'], ['GET', rid], ['PUT', rid], ['DELETE', rid], ['GET', '/api/gimnasio/info']].map(([m, p]) => ({ m, p, op: p && paths[p] ? paths[p][m.toLowerCase()] : null }));
      const faltan = ops.filter(o => !o.op).map(o => o.m + ' ' + (o.p || '/api/actividades/{id}'));
      t('[H01] /v3/api-docs carga (springdoc instalado)', () => exige(cod === 200 && j && j.paths, 'Recibido ' + cod));
      t('[H01] El documento OpenAPI tiene las 6 operaciones', () => exige(!faltan.length, 'Faltan: ' + faltan.join(', ')));
      const hay = ops.filter(o => o.op);
      t('[H02] @Tag en cada controlador (sin nombres por defecto «…-controller»)', () => { exige(hay.length, 'No hay operaciones'); const mal = hay.filter(o => !o.op.tags || !o.op.tags.length || o.op.tags.some(x => /-controller$/.test(x))).map(o => o.m + ' ' + o.p); exige(!mal.length, 'Sin @Tag: ' + mal.join(', ')); });
      t('[H03] @Operation con resumen o descripción en cada endpoint', () => { exige(hay.length, 'No hay operaciones'); const mal = hay.filter(o => !(o.op.summary || o.op.description)).map(o => o.m + ' ' + o.p); exige(!mal.length, 'Sin @Operation: ' + mal.join(', ')); });
      const errores = { 'POST /api/actividades': ['400', '409'], ['GET ' + rid]: ['404'], ['PUT ' + rid]: ['400', '404', '409'], ['DELETE ' + rid]: ['404'] };
      t('[H04] @ApiResponse con los códigos de error de cada endpoint', () => { exige(hay.length, 'No hay operaciones'); const mal = hay.filter(o => errores[o.m + ' ' + o.p] && !Object.keys(o.op.responses || {}).some(c => /^4/.test(c))).map(o => o.m + ' ' + o.p); exige(!mal.length, 'Sin respuestas de error: ' + mal.join(', ')); });
      const exitos = { 'POST /api/actividades': '201', ['DELETE ' + rid]: '204' };
      t('[D08] OpenAPI recoge todas las respuestas posibles de cada endpoint', () => { exige(hay.length === 6, 'Faltan operaciones'); const mal = []; hay.forEach(o => { const k = o.m + ' ' + o.p; const r = Object.keys(o.op.responses || {}); const pide = (errores[k] || []).concat(exitos[k] ? [exitos[k]] : []); const f = pide.filter(c => !r.includes(c)); if (f.length) mal.push(k + ' (falta ' + f.join(', ') + ')'); }); exige(!mal.length, mal.join('; ')); });
      const esquemas = (j && j.components && j.components.schemas) || {};
      const dto = esquemas.ActividadPeticionDto || Object.values(esquemas).find(s => s && s.properties && s.properties.nombre && s.properties.plazas && !s.properties.id);
      t('[H06] Ejemplos (@Schema) en el DTO', () => { exige(dto, 'No encuentro el esquema del DTO'); const conEj = Object.values(dto.properties || {}).filter(p => p && (p.example !== undefined || (p.examples && Object.keys(p.examples).length))); exige(conEj.length, 'Ningún campo tiene example'); });
      t('[H07] Información general de la API: título, versión y contacto', () => { const i = (j && j.info) || {}; exige(i.title && i.title !== 'OpenAPI definition', 'Título por defecto'); exige(i.version && i.version !== 'v0', 'Versión por defecto'); exige(i.contact && (i.contact.name || i.contact.email || i.contact.url), 'Sin contacto'); });
      pm.collectionVariables.set('resultados', JSON.stringify(R));
    language: text/javascript
order: 1000
