$kind: http-request
url: "{{baseUrl}}/api/actividades"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('resultados', '{}');
      const rnd = Math.random().toString(36).slice(2, 6);
      pm.collectionVariables.set('rnd', rnd);
      pm.collectionVariables.set('rndMay', rnd.toUpperCase());
      pm.collectionVariables.set('nombre50', ('Largo ' + rnd + ' ' + 'x'.repeat(60)).slice(0, 50));
      pm.collectionVariables.set('nombre51', ('Largo ' + rnd + ' ' + 'y'.repeat(60)).slice(0, 51));
      ['idPilates', 'idSpinning', 'idYoga', 'idBody', 'idNueva', 'idLargo', 'idMax'].forEach(k => pm.collectionVariables.set(k, ''));
      pm.collectionVariables.set('maxPlazas', 30); pm.collectionVariables.set('maxMas1', 31);
    language: text/javascript
  - type: afterResponse
    code: |-
      const R = JSON.parse(pm.collectionVariables.get('resultados') || '{}');
      const t = (n, f) => { const id = n.slice(1, 4); let ok = true, msg = ''; try { f(); } catch (e) { ok = false; msg = e && e.message ? e.message : String(e); } pm.test(n, () => { if (!ok) throw new Error(msg); }); const e = R[id] || (R[id] = [0, 0, []]); if (ok) e[0]++; else { e[1]++; if (e[2].length < 6) e[2].push(n.slice(6) + (msg ? ' → ' + msg : '')); } };
      const cod = pm.response.code;
      let j = null; try { j = pm.response.json(); } catch (e) { j = null; }
      const exige = (c, m) => { if (!c) throw new Error(m); };
      const esperado = (...cs) => exige(cs.includes(cod), 'Recibido ' + cod + ', se esperaba ' + cs.join(' o '));
      const exito = () => exige(cod >= 200 && cod < 300, 'Recibido ' + cod + (cod === 404 ? ' (la ruta o la actividad no existe)' : ''));
      const error4xx = () => exige(cod >= 400 && cod < 500, 'Recibido ' + cod + ', se esperaba un error 4xx');
      const rechaza = () => exige(cod >= 400 && cod < 500 && cod !== 404 && cod !== 405, 'Recibido ' + cod + ': no se ha aplicado la regla');
      const no500 = () => exige(cod < 500, 'Recibido ' + cod + ': un error del cliente no puede acabar en 500');
      const problema = () => { const ct = String(pm.response.headers.get('Content-Type') || ''); exige(ct.includes('problem+json') || (j && typeof j === 'object' && !Array.isArray(j) && 'status' in j && ('title' in j || 'detail' in j)), 'La respuesta de error no es un ProblemDetail (Content-Type ' + (ct || 'vacío') + ')'); };
      const esJson = () => exige(String(pm.response.headers.get('Content-Type') || '').includes('json') && j !== null, 'La respuesta no es JSON');
      const lista = () => { exige(Array.isArray(j), 'La respuesta no es una lista JSON'); return j; };
      const v = (k) => pm.collectionVariables.get(k);
      t('[E01] GET /api/actividades responde con éxito', () => exige(cod === 200, cod === 404 ? 'La ruta da 404. Si en el controlador hay @GetMapping("/"), la ruta lleva barra final (/api/actividades/) y no coincide con la del enunciado' : 'Recibido ' + cod));
      t('[D07] La ruta /api/actividades existe y responde 200', () => esperado(200));
      t('[D06] La lista se devuelve en JSON', () => esJson());
      const busca = (txt) => Array.isArray(j) ? j.find(a => a && String(a.nombre || '').toLowerCase() === txt) : null;
      const ej = { idPilates: busca('pilates'), idSpinning: busca('spinning'), idYoga: busca('yoga'), idBody: busca('body pump') };
      const porDefecto = { idPilates: 1, idSpinning: 2, idYoga: 3, idBody: 4 };
      Object.keys(ej).forEach(k => pm.collectionVariables.set(k, ej[k] && ej[k].id != null ? ej[k].id : porDefecto[k]));
      t('[E02] Carga las 4 actividades de ejemplo (Pilates, Spinning, Yoga, Body pump)', () => { lista(); const faltan = Object.keys(ej).filter(k => !ej[k]).map(k => k.slice(2)); exige(!faltan.length, 'Faltan: ' + faltan.join(', ')); exige(j.length === 4, 'Hay ' + j.length + ' actividades al arrancar, se esperaban 4 (¿la aplicación estaba recién arrancada?)'); });
      t('[E02] Los datos de ejemplo tienen las plazas del enunciado', () => { const d = [['idPilates', 12, 0], ['idSpinning', 20, 8], ['idYoga', 15, 15], ['idBody', 25, 3]]; const mal = d.filter(([k, p, l]) => !ej[k] || ej[k].plazas !== p || ej[k].plazasLibres !== l).map(([k]) => k.slice(2)); exige(!mal.length, 'Plazas o plazasLibres distintas en: ' + mal.join(', ')); });
      pm.collectionVariables.set('resultados', JSON.stringify(R));
    language: text/javascript
order: 1000
