$kind: http-request
url: "{{baseUrl}}/api/categorias"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "{{nombreCategoria}}",
      "descripcion": "Creada en la prueba"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("POST /api/categorias responde 201", function () {
          pm.expect(pm.response.code >= 200 && pm.response.code < 300, "Recibido " + pm.response.code + " · " + pm.response.text().substring(0, 120)).to.be.true;
      });
      pm.test("Crear categoría devuelve 201 Created", function () {
          pm.expect(pm.response.code, "Recibido " + pm.response.code).to.eql(201);
      });
      let id = null;
      try { id = pm.response.json().id; } catch (e) { }
      if (!id) {
          const l = pm.response.headers.get("Location");
          if (l) { const m = l.match(/(\d+)\/?$/); if (m) { id = m[1]; } }
      }
      pm.collectionVariables.set("idCategoria", id);
    language: text/javascript
order: 2000
