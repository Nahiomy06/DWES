$kind: http-request
url: "{{baseUrl}}/api/categorias/{{idCategoria}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("GET /api/categorias/{id} responde 200", function () {
          pm.expect(pm.response.code >= 200 && pm.response.code < 300, "Recibido " + pm.response.code + " · " + pm.response.text().substring(0, 120)).to.be.true;
      });
      pm.test("GET /api/categorias/{id} devuelve la categoría creada", function () { let n = null; try { n = pm.response.json().nombre; } catch (e) { } pm.expect(n, "nombre recibido: " + n).to.eql(pm.collectionVariables.get("nombreCategoria")); });
      pm.test("La respuesta es JSON", function () {
          pm.expect((pm.response.headers.get("Content-Type") || "").indexOf("json") >= 0, "Content-Type: " + pm.response.headers.get("Content-Type")).to.be.true;
      });
    language: text/javascript
order: 7000
