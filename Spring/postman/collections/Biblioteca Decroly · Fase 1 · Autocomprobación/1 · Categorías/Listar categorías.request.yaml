$kind: http-request
url: "{{baseUrl}}/api/categorias"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      // Datos inventados en cada ejecución para no chocar con los datos de ejemplo del alumno
      const letras = "BCDFGHJKLMNPQRSTVWXZ";
      let suf = "";
      for (let i = 0; i < 4; i++) { suf += letras.charAt(Math.floor(Math.random() * letras.length)); }
      const bonito = suf.charAt(0) + suf.substring(1).toLowerCase();
      function isbn() { let s = "979"; for (let i = 0; i < 10; i++) { s += Math.floor(Math.random() * 10); } return s; }
      pm.collectionVariables.set("sufijo", suf);
      pm.collectionVariables.set("nombreCategoria", "Prueba " + bonito);
      pm.collectionVariables.set("nombreCategoriaMayus", ("Prueba " + bonito).toUpperCase());
      pm.collectionVariables.set("nombreCategoria2", "Prueba Otra " + bonito);
      pm.collectionVariables.set("autor", "Ana María " + bonito);
      pm.collectionVariables.set("filtroAutor", ("María " + bonito).toUpperCase());
      pm.collectionVariables.set("isbn1", isbn());
      pm.collectionVariables.set("isbn2", isbn());
      pm.collectionVariables.set("isbn3", isbn());
      pm.collectionVariables.set("isbn4", isbn());
      for (let k = 5; k <= 10; k++) { pm.collectionVariables.set("isbn" + k, isbn()); }
      pm.collectionVariables.set("idCategoria", "");
      pm.collectionVariables.set("idCategoria2", "");
      pm.collectionVariables.set("idLibro", "");
      pm.collectionVariables.set("idLibro2", "");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("GET /api/categorias responde 200", function () {
          pm.expect(pm.response.code >= 200 && pm.response.code < 300, "Recibido " + pm.response.code + " · " + pm.response.text().substring(0, 120)).to.be.true;
      });
      function lista() {
          try { const j = pm.response.json(); return Array.isArray(j) ? j : null; } catch (e) { return null; }
      }
      function contieneId(l, id) {
          if (!l) { return false; }
          for (let i = 0; i < l.length; i++) { if (String(l[i].id) === String(id)) { return true; } }
          return false;
      }
      pm.test("GET /api/categorias devuelve una lista", function () { pm.expect(lista() !== null, pm.response.text().substring(0, 120)).to.be.true; });
      pm.test("La respuesta es JSON", function () {
          pm.expect((pm.response.headers.get("Content-Type") || "").indexOf("json") >= 0, "Content-Type: " + pm.response.headers.get("Content-Type")).to.be.true;
      });
    language: text/javascript
order: 1000
