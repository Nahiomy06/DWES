$kind: http-request
url: "{{baseUrl}}/api/libros"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isbn": "{{isbn1}}",
      "titulo": "Libro de prueba",
      "autor": "{{autor}}",
      "anioPublicacion": 1959,
      "ejemplares": 3,
      "categoriaId": {{idCategoria}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("POST /api/libros responde 201", function () {
          pm.expect(pm.response.code >= 200 && pm.response.code < 300, "Recibido " + pm.response.code + " · " + pm.response.text().substring(0, 120)).to.be.true;
      });
      pm.test("Crear libro devuelve 201 Created", function () {
          pm.expect(pm.response.code, "Recibido " + pm.response.code).to.eql(201);
      });
      let id = null;
      try { id = pm.response.json().id; } catch (e) { }
      if (!id) {
          const l = pm.response.headers.get("Location");
          if (l) { const m = l.match(/(\d+)\/?$/); if (m) { id = m[1]; } }
      }
      pm.collectionVariables.set("idLibro", id);
      pm.test("Al crear con 3 ejemplares, disponibles = 3", function () { let d = null; try { d = pm.response.json().disponibles; } catch (e) { } pm.expect(d, "disponibles: " + d).to.eql(3); });
    language: text/javascript
order: 1000
