$kind: http-request
url: "{{baseUrl}}/api/libros/disponibles"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("GET /api/libros/disponibles responde 200", function () {
          pm.expect(pm.response.code >= 200 && pm.response.code < 300, "Recibido " + pm.response.code + " · " + pm.response.text().substring(0, 120)).to.be.true;
      });
      function lista() {
          try { const j = pm.response.json(); return Array.isArray(j) ? j : null; } catch (e) { return null; }
      }
      function contieneId(l, id) {
          if (!l) { return false; }
          for (let i = 0; i < l.length; i++) { if (String(l[i].id) === String(id)) { return true; } }
          return false;
      }
      pm.test("/disponibles solo devuelve libros con disponibles > 0 e incluye el creado", function () {
          const l = lista();
          let ok = l !== null && contieneId(l, pm.collectionVariables.get("idLibro"));
          if (l) { for (let i = 0; i < l.length; i++) { if (!(l[i].disponibles > 0)) { ok = false; } } }
          pm.expect(ok, pm.response.text().substring(0, 120)).to.be.true;
      });
    language: text/javascript
order: 13000
