$kind: http-request
url: "{{baseUrl}}/api/libros"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isbn": "{{isbn2}}",
      "titulo": "Segundo libro de prueba",
      "autor": "Autor Prueba {{sufijo}}",
      "anioPublicacion": 2001,
      "ejemplares": 1,
      "categoriaId": {{idCategoria}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("POST /api/libros (segundo) responde 201", function () {
          pm.expect(pm.response.code >= 200 && pm.response.code < 300, "Recibido " + pm.response.code + " · " + pm.response.text().substring(0, 120)).to.be.true;
      });
      let id = null;
      try { id = pm.response.json().id; } catch (e) { }
      if (!id) {
          const l = pm.response.headers.get("Location");
          if (l) { const m = l.match(/(\d+)\/?$/); if (m) { id = m[1]; } }
      }
      pm.collectionVariables.set("idLibro2", id);
    language: text/javascript
order: 9000
