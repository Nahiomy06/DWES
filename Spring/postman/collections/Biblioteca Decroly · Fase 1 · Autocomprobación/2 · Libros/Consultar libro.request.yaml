$kind: http-request
url: "{{baseUrl}}/api/libros/{{idLibro}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("GET /api/libros/{id} responde 200", function () {
          pm.expect(pm.response.code >= 200 && pm.response.code < 300, "Recibido " + pm.response.code + " · " + pm.response.text().substring(0, 120)).to.be.true;
      });
      pm.test("GET /api/libros/{id} devuelve el libro creado", function () { let i = null; try { i = pm.response.json().isbn; } catch (e) { } pm.expect(i, "isbn recibido: " + i).to.eql(pm.collectionVariables.get("isbn1")); });
      pm.test("La respuesta es JSON", function () {
          pm.expect((pm.response.headers.get("Content-Type") || "").indexOf("json") >= 0, "Content-Type: " + pm.response.headers.get("Content-Type")).to.be.true;
      });
    language: text/javascript
order: 14000
