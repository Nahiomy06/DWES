$kind: http-request
url: "{{baseUrl}}/api/biblioteca/info"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("GET /api/biblioteca/info responde 200", function () {
          pm.expect(pm.response.code >= 200 && pm.response.code < 300, "Recibido " + pm.response.code + " · " + pm.response.text().substring(0, 120)).to.be.true;
      });
      function valores(o, l) {
          if (o !== null && typeof o === "object") { for (const k in o) { valores(o[k], l); } } else { l.push(String(o).toLowerCase()); }
          return l;
      }
      pm.test("/api/biblioteca/info muestra el nombre, el máximo de préstamos y los días de préstamo", function () {
          let v = [];
          try { v = valores(pm.response.json(), []); } catch (e) { }
          const esperados = [pm.collectionVariables.get("nombreBiblioteca"), pm.collectionVariables.get("maxPrestamos"), pm.collectionVariables.get("diasPrestamo")];
          const faltan = [];
          for (let i = 0; i < esperados.length; i++) { if (v.indexOf(String(esperados[i]).toLowerCase()) < 0) { faltan.push(esperados[i]); } }
          pm.expect(faltan.length === 0, "No aparece: " + faltan.join(", ") + " · recibido: " + pm.response.text().substring(0, 150)).to.be.true;
      });
      pm.test("La respuesta es JSON", function () {
          pm.expect((pm.response.headers.get("Content-Type") || "").indexOf("json") >= 0, "Content-Type: " + pm.response.headers.get("Content-Type")).to.be.true;
      });
    language: text/javascript
order: 1000
