$kind: http-request
url: "{{baseUrl}}/api/categorias/{{idCategoria}}/libros"
method: GET
scripts:
  - type: afterResponse
    code: |-
      function lista() {
          try { const j = pm.response.json(); return Array.isArray(j) ? j : null; } catch (e) { return null; }
      }
      function contieneId(l, id) {
          if (!l) { return false; }
          for (let i = 0; i < l.length; i++) { if (String(l[i].id) === String(id)) { return true; } }
          return false;
      }
      pm.test("GET /api/categorias/{id}/libros devuelve los libros de la categoría", function () { pm.expect(pm.response.code === 200 && contieneId(lista(), pm.collectionVariables.get("idLibro")), "Recibido " + pm.response.code).to.be.true; });
    language: text/javascript
order: 1000
