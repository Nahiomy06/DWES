$kind: http-request
url: "{{baseUrl}}/api/libros/{{idLibro}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isbn": "{{isbn1}}",
      "titulo": "Libro de prueba (modificado)",
      "autor": "{{autor}}",
      "anioPublicacion": 1959,
      "ejemplares": 3,
      "categoriaId": {{noExiste}}
    }
scripts:
  - type: afterResponse
    code: pm.test("Modificar un libro con una categoría que no existe devuelve 400 o 404", function () { pm.expect(pm.response.code, "Recibido " + pm.response.code).to.be.oneOf([400, 404]); });
    language: text/javascript
order: 4000
