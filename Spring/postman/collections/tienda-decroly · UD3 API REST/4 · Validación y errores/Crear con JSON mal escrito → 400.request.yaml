$kind: http-request
url: "{{baseUrl}}/api/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "nombre": "Sin comillas de cierre,
        "precio": 10
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 400: Jackson no puede leer el cuerpo", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 8000
