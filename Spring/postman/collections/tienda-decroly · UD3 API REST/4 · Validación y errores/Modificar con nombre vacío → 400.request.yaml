$kind: http-request
url: "{{baseUrl}}/api/productos/{{idCreado}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "nombre": "",
        "precio": 15,
        "stock": 50
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Cuerpo ProblemDetail (application/problem+json)", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
          const p = pm.response.json();
          pm.expect(p.status).to.eql(400);
          pm.expect(p.title).to.eql("Peticion incorrecta");
          pm.expect(p.detail).to.be.a("string");
      });

      pm.test("detail indica que el nombre es obligatorio", function () {
          const d = pm.response.json().detail.toLowerCase();
          pm.expect(d).to.include("nombre");
          pm.expect(d).to.include("obligatorio");
      });
    language: text/javascript
order: 6000
