$kind: http-request
url: "{{baseUrl}}/api/productos/{{idExistente}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200 y JSON", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      function esProducto(p) {
          pm.expect(p).to.have.property("id");
          pm.expect(p.id).to.be.a("number");
          pm.expect(p.nombre).to.be.a("string");
          pm.expect(p.precio).to.be.a("number");
          pm.expect(p.stock).to.be.a("number");
      }

      pm.test("Devuelve un único objeto con el id pedido", function () {
          const p = pm.response.json();
          pm.expect(p).to.be.an("object");
          esProducto(p);
          pm.expect(p.id).to.eql(Number(pm.collectionVariables.get("idExistente")));
      });
    language: text/javascript
order: 2000
