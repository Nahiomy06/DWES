$kind: http-request
description: "Ejecuta la colección justo después de arrancar: si ya se han creado o borrado productos, falla la comprobación de los datos iniciales. Pon en la variable 'origen' el valor de tienda.productos.origen (memoria, json o api)."
url: "{{baseUrl}}/api/productos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      function esProducto(p) {
          pm.expect(p).to.have.property("id");
          pm.expect(p.id).to.be.a("number");
          pm.expect(p.nombre).to.be.a("string");
          pm.expect(p.precio).to.be.a("number");
          pm.expect(p.stock).to.be.a("number");
      }

      pm.test("Código 200 y JSON", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
      const lista = pm.response.json();
      pm.test("Devuelve un array de productos con id, nombre, precio y stock", function () {
          pm.expect(lista).to.be.an("array");
          pm.expect(lista.length).to.be.above(0);
          for (let i = 0; i < lista.length; i++) { esProducto(lista[i]); }
      });
      // Datos para las peticiones siguientes
      let maxId = 0;
      for (let i = 0; i < lista.length; i++) { if (lista[i].id > maxId) maxId = lista[i].id; }
      pm.collectionVariables.set("idExistente", lista[0].id);
      pm.collectionVariables.set("precioExistente", lista[0].precio);
      pm.collectionVariables.set("maxIdInicial", maxId);

      const origen = pm.variables.get("origen") || "";
      const esperado = {
          memoria: { total: 3, nombres: ["Teclado mecanico", "Raton inalambrico", "Monitor 24 pulgadas"] },
          json: { total: 4, nombres: ["Portatil 15", "Auriculares BT", "Disco SSD 1 TB", "Hub USB-C"] },
          api: { total: 20, nombres: null }
      };
      if (esperado[origen]) {
          pm.test("Datos iniciales del origen '" + origen + "' (reinicia la aplicación antes de ejecutar)", function () {
              pm.expect(lista.length).to.eql(esperado[origen].total);
              const nombres = esperado[origen].nombres;
              if (nombres !== null) {
                  for (let i = 0; i < nombres.length; i++) {
                      pm.expect(lista[i].id).to.eql(i + 1);
                      pm.expect(lista[i].nombre).to.eql(nombres[i]);
                  }
              }
          });
      } else {
          console.log("Variable 'origen' vacía o desconocida: no se comprueban los datos iniciales");
      }
    language: text/javascript
order: 1000
