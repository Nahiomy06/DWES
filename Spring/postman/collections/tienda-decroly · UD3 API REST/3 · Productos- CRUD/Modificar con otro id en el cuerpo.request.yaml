$kind: http-request
url: "{{baseUrl}}/api/productos/{{idCreado}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "id": 555,
        "nombre": "Alfombrilla XXL",
        "precio": 15.00,
        "stock": 50
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200 y JSON", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("El id sale de la URL, no del cuerpo", function () {
          pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get("idCreado")));
      });
    language: text/javascript
order: 9000
