$kind: http-request
url: "{{baseUrl}}{{locationPath}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200 y JSON", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Location lleva al producto recién creado", function () {
          const p = pm.response.json();
          pm.expect(p.id).to.eql(Number(pm.collectionVariables.get("idCreado")));
          pm.expect(p.nombre).to.eql("Alfombrilla XL");
      });
    language: text/javascript
order: 2000
