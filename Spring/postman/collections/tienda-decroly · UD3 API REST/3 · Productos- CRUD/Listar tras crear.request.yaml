$kind: http-request
url: "{{baseUrl}}/api/productos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200 y JSON", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("El listado incluye los productos creados", function () {
          const ids = [];
          const lista = pm.response.json();
          for (let i = 0; i < lista.length; i++) { ids.push(lista[i].id); }
          pm.expect(ids).to.include(Number(pm.collectionVariables.get("idCreado")));
          pm.expect(ids).to.include(Number(pm.collectionVariables.get("idCreado2")));
      });
    language: text/javascript
order: 6000
