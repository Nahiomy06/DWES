$kind: http-request
url: "{{baseUrl}}/swagger-ui.html"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200 (tras la redirección a /swagger-ui/index.html)", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Es la página HTML de Swagger UI", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("text/html");
          pm.expect(pm.response.text().toLowerCase()).to.include("swagger");
      });
    language: text/javascript
order: 3000
