$kind: http-request
url: "{{baseUrl}}/api/productos/{{idPrecio}}/precio?moneda=XYZ"
method: GET
queryParams:
  moneda: XYZ
scripts:
  - type: beforeRequest
    code: |-
      const esc = pm.variables.get("escenario") || "";
      if (esc.indexOf("divisas") === 0) {
          console.log("Omitida: el escenario " + esc + " deja el servicio de divisas sin funcionar");
          pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Código 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Cuerpo ProblemDetail (application/problem+json)", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
          const p = pm.response.json();
          pm.expect(p.status).to.eql(400);
          pm.expect(p.title).to.eql("Peticion incorrecta");
          pm.expect(p.detail).to.be.a("string");
      });

      pm.test("detail explica el error", function () {
          pm.expect(pm.response.json().detail).to.eql("Moneda no admitida: XYZ");
      });
    language: text/javascript
order: 9000
