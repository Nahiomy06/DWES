$kind: http-request
url: "{{baseUrl}}/api/productos/{{idPrecio}}/precio"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200 y JSON", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      function totalEsperado(base) {
          const iva = Number(pm.variables.get("iva"));
          return Math.round(base * (1 + iva / 100) * 100) / 100;
      }

      const r = pm.response.json();
      pm.test("PrecioMonedaDto con idProducto, moneda, tipoCambio y total", function () {
          pm.expect(r.idProducto).to.eql(Number(pm.collectionVariables.get("idPrecio")));
          pm.expect(r.moneda).to.eql("EUR");
          pm.expect(r.tipoCambio).to.eql(1);
          pm.expect(r.total).to.be.a("number");
      });
      pm.test("total = precio con IVA (" + pm.variables.get("iva") + " %) redondeado a céntimos", function () {
          pm.expect(Math.abs(r.total - totalEsperado(100))).to.be.below(0.011);
      });
      pm.collectionVariables.set("totalEur", r.total);
    language: text/javascript
order: 2000
