$kind: http-request
name: "Frankfurter: EUR → USD"
url: "{{divisasUrl}}/latest?base=EUR&symbols=USD"
method: GET
queryParams:
  base: EUR
  symbols: USD
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200 y JSON", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      const r = pm.response.json();
      pm.test("Trae base, date y rates.USD (los campos de TipoCambioDto)", function () {
          pm.expect(r.base).to.eql("EUR");
          pm.expect(r.date).to.be.a("string");
          pm.expect(r.rates.USD).to.be.a("number");
      });
    language: text/javascript
order: 2000
