$kind: http-request
name: "DummyJSON: 3 productos"
url: "{{catalogoUrl}}/products?limit=3"
method: GET
queryParams:
  limit: "3"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200 y JSON", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      const r = pm.response.json();
      pm.test("Objeto con products, total, skip y limit", function () {
          pm.expect(r.products).to.be.an("array");
          pm.expect(r.products.length).to.eql(3);
          pm.expect(r.total).to.be.a("number");
          pm.expect(r.skip).to.eql(0);
          pm.expect(r.limit).to.eql(3);
      });
      pm.test("Cada producto trae id, title, price y stock (los campos que lee ProductoExternoDto)", function () {
          for (let i = 0; i < r.products.length; i++) {
              const p = r.products[i];
              pm.expect(p.id).to.be.a("number");
              pm.expect(p.title).to.be.a("string");
              pm.expect(p.price).to.be.a("number");
              pm.expect(p.stock).to.be.a("number");
          }
      });
    language: text/javascript
order: 1000
