$kind: http-request
url: "{{baseUrl}}/buscar"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", function () { pm.response.to.have.status(200); });
      pm.test("Usa el valor por defecto \"todo\"", function () {
          pm.expect(pm.response.text()).to.include("todo");
      });
    language: text/javascript
order: 4000
