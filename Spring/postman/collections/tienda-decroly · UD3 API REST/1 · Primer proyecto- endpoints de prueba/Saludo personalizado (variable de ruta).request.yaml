$kind: http-request
url: "{{baseUrl}}/hola/Ana"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", function () { pm.response.to.have.status(200); });
      pm.test("Incluye el nombre de la ruta", function () {
          pm.expect(pm.response.text()).to.include("Hola Ana");
      });
    language: text/javascript
order: 2000
