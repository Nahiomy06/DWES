$kind: http-request
description: Debe estar mapeado a /saludo (si en el experimento se cambió a /hola, hay que dejarlo como estaba).
url: "{{baseUrl}}/saludo"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", function () { pm.response.to.have.status(200); });
      pm.test("Devuelve texto plano", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("text/plain");
      });
      pm.test("El cuerpo no está vacío", function () {
          pm.expect(pm.response.text().trim().length).to.be.above(0);
      });
    language: text/javascript
order: 1000
