$kind: http-request
name: "ProblemDetail de Spring: JSON mal escrito"
url: "{{baseUrl}}/api/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "nombre": "Sin comillas de cierre,
        "precio": 10
    }
scripts:
  - type: beforeRequest
    code: |-
      if ((pm.variables.get("escenario") || "") !== "problemdetails") {
          console.log("Omitida: solo se ejecuta con escenario = problemdetails");
          pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Código 400 en formato ProblemDetail", function () {
          pm.response.to.have.status(400);
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
          pm.expect(pm.response.json().status).to.eql(400);
      });
    language: text/javascript
order: 4000
