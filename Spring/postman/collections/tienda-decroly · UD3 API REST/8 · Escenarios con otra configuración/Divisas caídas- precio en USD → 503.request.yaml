$kind: http-request
name: "Divisas caídas: precio en USD → 503"
url: "{{baseUrl}}/api/productos/{{idExistente}}/precio?moneda=USD"
method: GET
queryParams:
  moneda: USD
scripts:
  - type: beforeRequest
    code: |-
      if ((pm.variables.get("escenario") || "") !== "divisas-caidas") {
          console.log("Omitida: solo se ejecuta con escenario = divisas-caidas");
          pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Código 503", function () {
          pm.response.to.have.status(503);
      });
      pm.test("Cuerpo ProblemDetail (application/problem+json)", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
          const p = pm.response.json();
          pm.expect(p.status).to.eql(503);
          pm.expect(p.title).to.eql("Servicio externo no disponible");
          pm.expect(p.detail).to.be.a("string");
      });

      pm.test("detail explica el error", function () {
          pm.expect(pm.response.json().detail).to.eql("El servicio de divisas no esta disponible");
      });
    language: text/javascript
order: 1000
